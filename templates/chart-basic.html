<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}}</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui;padding:24px;background:#f8fafc;color:#0f172a}
  h1{font-size:20px;margin:0 0 16px}
  #chart{width:100%;height:520px;background:#fff;border:1px solid #e2e8f0;border-radius:12px}
</style>
</head>
<body>
<h1>{{TITLE}}</h1>
<div id="chart"></div>
<script src="{{ECHARTS_SRC}}"></script>
<script>
  const option = {{OPTION}};
  const chart = echarts.init(document.getElementById('chart'));
  chart.setOption(option);
  window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
